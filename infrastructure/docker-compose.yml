services:
  server:
    build:
      context: ../
      dockerfile: infrastructure/Dockerfile.server
    restart: unless-stopped
    expose:
      - "3001"
    volumes:
      - ../server/database:/app/server/database
    environment:
      PORT: 3001
      NODE_ENV: production
      SQLITE_PATH: /app/server/database/cacblaze.db
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4028}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-support@cacblaze.com}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-support@cacblaze.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CONTENT_MODEL: ${OPENAI_CONTENT_MODEL:-gpt-5.4-mini}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  client:
    build:
      context: ../
      dockerfile: infrastructure/Dockerfile.client
    restart: unless-stopped
    ports:
      - "4028:4028"
    depends_on:
      server:
        condition: service_healthy
    environment:
      PORT: 4028
      HOST: 0.0.0.0
      SERVER_API_URL: http://server:3001/api
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://cacblaze.com}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4028').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

services:
  - type: web
    name: cacblaze-api
    runtime: docker
    plan: starter
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./infrastructure/Dockerfile.server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: CORS_ORIGIN
        value: https://cacblaze.com
      - key: DATABASE_URL
        fromDatabase:
          name: cacblaze-db
          property: connectionString
      - key: POSTGRES_SSL
        value: "true"
      - key: REQUIRE_MANAGED_DB
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: AI_AUTOMATION_ENABLED
        value: "true"
      - key: ALLOW_AI_PUBLISHER_AUTO_CREATE
        value: "true"
      - key: AI_WEEKLY_ARTICLE_TARGET
        value: "7"
      - key: AI_WEEKLY_TIP_TARGET
        value: "7"
      - key: AI_MIN_PUBLISHED_ARTICLES
        value: "6"
      - key: AI_MIN_PUBLISHED_WORDS
        value: "2000"
      - key: OPENAI_CONTENT_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: cacblaze-db
    plan: basic-256mb
    region: frankfurt
    databaseName: cacblaze
    user: cacblaze
    ipAllowList: []
